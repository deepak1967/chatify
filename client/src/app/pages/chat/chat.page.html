<div class="chat-screen">
  <header class="chat-topbar">
    <div class="topbar-left">
      <div class="user-chip" *ngIf="username">
        <span class="user-icon"><img src="./../../../assets/icon/user.png" alt=""></span>
        <div class="user-details">
          <span class="user-name">{{ username }}</span>
          <span class="status-text"
            >{{ isConnected ? 'Connected' : 'Connecting...' }}</span
          >
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <button type="button" class="leave-btn" (click)="leaveRoom()">
        Leave
      </button>
    </div>
  </header>

  <section class="chat-panel">
    <div class="participants-row" *ngIf="participantNames">
      <div class="participants-label">Participants</div>
      <div class="participants-list">{{ participantNames }}</div>
    </div>

    <div class="chat-messages" #chatContainer *ngIf="messages.length; else noMessages">
      <div
        *ngFor="let msg of messages"
        class="message"
        [class.sender]="msg.sender === socketId"
        [class.receiver]="msg.sender !== socketId"
      >
        <div class="message-header" *ngIf="msg.sender !== 'system' && participants.length > 2">
          <span class="sender-name">
            {{ msg.sender === socketId ? 'You' : msg.username }}
          </span>
        </div>
        <div class="message-text">{{ msg.content }}</div>
      </div>
      <div #chatEnd class="scroll-anchor"></div>
    </div>

    <ng-template #noMessages>
      <div class="empty-state">
        <p>No messages yet.</p>
        <p>Start the conversation by typing a message.</p>
      </div>
    </ng-template>
  </section>

  <form class="chat-input-bar" (submit)="$event.preventDefault()">
    <input
      #messageInput
      type="text"
      id="messageInput"
      [(ngModel)]="message"
      name="message"
      [disabled]="!isConnected"
      placeholder="Write message..."
      (keydown.enter)="onEnter($event)"
    />
    <button
      type="button"
      id="sendBtn"
      tabindex="-1"
      (pointerdown)="$event.preventDefault()"
      (click)="sendMessage()"
      [disabled]="!message.trim() || !isConnected"
      aria-label="Send message"
    >
      <span class="send-icon">➤</span>
    </button>
  </form>
</div>
