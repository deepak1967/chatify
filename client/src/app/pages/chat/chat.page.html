<div class="chat-screen">
  <header class="chat-topbar">
    <div class="topbar-left">
      <button type="button" class="icon-btn back-btn">←</button>
      <div class="header-info">
        <div class="app-title">Chat Room</div>
        <div class="status-text">{{ isConnected ? 'Connected' : 'Connecting...' }}</div>
      </div>
    </div>

    <div class="user-chip" *ngIf="username">
      <span class="user-initial">{{ username?.charAt(0)?.toUpperCase() }}</span>
      <span class="user-name">{{ username }}</span>
    </div>
  </header>

  <section class="chat-panel">
    <div class="participants-row" *ngIf="participantNames">
      <div class="participants-label">Participants</div>
      <div class="participants-list">{{ participantNames }}</div>
    </div>

    <div class="chat-messages" *ngIf="messages.length; else noMessages">
      <div
        *ngFor="let msg of messages"
        class="message"
        [class.sender]="msg.sender === socketId"
        [class.receiver]="msg.sender !== socketId"
      >
        <div class="message-text">{{ msg.content }}</div>
      </div>
    </div>

    <ng-template #noMessages>
      <div class="empty-state">
        <p>No messages yet.</p>
        <p>Start the conversation by typing a message.</p>
      </div>
    </ng-template>

    <div #chatEnd class="scroll-anchor"></div>
  </section>

  <form class="chat-input-bar" (ngSubmit)="sendMessage()">
    <input
      type="text"
      id="messageInput"
      [(ngModel)]="message"
      name="message"
      [disabled]="!isConnected"
      placeholder="Write message..."
    />
    <button type="submit" id="sendBtn" [disabled]="!message.trim() || !isConnected">Send</button>
  </form>
</div>
