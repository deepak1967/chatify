<ion-content class="ion-padding" [fullscreen]="true">
  <div class="join-screen">
    <div class="join-card">
      <div class="join-head">
        <span class="join-icon">
          <img src="../../../assets/icon/chat.png" alt="Chat icon" />
        </span>
        <h1>Chat Room</h1>
      </div>

      <form (ngSubmit)="joinRoom()" #roomForm="ngForm" class="join-form">
        <div class="field-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            [(ngModel)]="username"
            placeholder="Enter your name"
          />
        </div>

        <div class="field-group">
          <label for="roomId">Room ID</label>
          <input
            type="text"
            id="roomId"
            name="roomId"
            required
            [(ngModel)]="roomId"
            placeholder="Enter Room Id"
          />
        </div>
        <p class="note">
          <span>Note:</span> Choose a unique private Room ID to join or create a room.
        </p>

        <button type="submit" [disabled]="!roomForm.form.valid">
          Join Room
        </button>
      </form>
    </div>
  </div>
</ion-content>
